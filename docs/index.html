<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiRi 예약 설정</title>
  <style>
    :root { --blue: #0066cc; --dark-link: #2997ff; --ink: #1d1d1f; --paper: #f5f5f7; --pearl: #fafafc; --dark: #272729; --dark-alt: #2a2a2c; --hairline: rgba(0, 0, 0, .08); --muted: #6e6e73; }
    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--paper); scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 17px; font-weight: 400; line-height: 1.47; letter-spacing: -.22px; }
    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }
    .content-frame { width: min(980px, calc(100% - 40px)); margin: 0 auto; }
    .global-nav { height: 44px; background: #000; color: #fff; font-size: 12px; line-height: 1; letter-spacing: -.12px; }
    .nav-inner { width: min(980px, calc(100% - 40px)); height: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .wordmark { color: #fff; font-weight: 600; font-size: 14px; letter-spacing: 0; text-decoration: none; }
    .sub-nav { position: sticky; top: 0; z-index: 10; height: 64px; background: rgba(245, 245, 247, .86); border-bottom: 1px solid var(--hairline); backdrop-filter: blur(18px); }
    .sub-nav .content-frame { height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .sub-nav h1 { margin: 0; font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 21px; font-weight: 600; line-height: 1.19; letter-spacing: -.23px; }
    .sub-nav span { color: var(--muted); font-size: 14px; }
    .connection-section { background: #fff; padding: 80px 0; }
    .connection-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 420px); gap: 80px; align-items: start; }
    .eyebrow, .section-label, .target-index { margin: 0 0 8px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .02em; line-height: 1.3; text-transform: uppercase; }
    .connection-copy h2 { margin: 0 0 12px; font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 40px; font-weight: 600; line-height: 1.1; letter-spacing: -.37px; }
    .connection-copy p:last-child { max-width: 420px; margin: 0; color: var(--muted); }
    .connection-form { display: grid; gap: 16px; }
    label { display: grid; gap: 5px; color: var(--ink); font-size: 14px; font-weight: 600; letter-spacing: -.22px; }
    input[type="text"], input[type="password"], input[type="date"], .select-input { width: 100%; min-height: 44px; border: 1px solid var(--hairline); border-radius: 8px; background: #fff; color: var(--ink); padding: 10px 12px; }
    input::placeholder { color: #86868b; }
    .form-note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .btn, button.btn { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: 9999px; padding: 9px 18px; font-size: 14px; font-weight: 400; line-height: 1.29; letter-spacing: -.22px; cursor: pointer; transition: transform .15s ease, background-color .15s ease, border-color .15s ease; }
    .btn:active, button.btn:active, .btn-icon:active, .weekday-btn:active, .seat-btn:active { transform: scale(.95); }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: #0071e3; }
    .btn-secondary { background: transparent; border-color: var(--hairline); color: var(--blue); }
    .btn-secondary:hover { border-color: var(--blue); }
    .btn-small { min-height: 36px; padding: 7px 14px; font-size: 13px; }
    .config-section { display: none; padding-bottom: 112px; }
    #targets-container { background: var(--paper); }
    .target-surface { padding: 64px 0; background: #fff; color: var(--ink); }
    .target-surface:nth-child(even) { background: var(--dark); color: #fff; }
    .target-surface:nth-child(even) .content-frame { --surface-field: #fff; }
    .target-surface:nth-child(even) .section-label, .target-surface:nth-child(even) .target-index, .target-surface:nth-child(even) .seat-map-legend { color: #cccccc; }
    .target-surface:nth-child(even) .route-summary, .target-surface:nth-child(even) .bus-selector, .target-surface:nth-child(even) .date-item, .target-surface:nth-child(even) .seat-map-bus { background: var(--dark-alt); border-color: rgba(255, 255, 255, .16); }
    .target-surface:nth-child(even) .route-summary span { color: #fff; }
    .target-surface:nth-child(even) .btn-secondary { border-color: rgba(255, 255, 255, .45); color: var(--dark-link); }
    .target-surface:nth-child(even) .name-input { color: #fff; border-color: rgba(255, 255, 255, .35); }
    .target-content { width: min(980px, calc(100% - 40px)); margin: 0 auto; }
    .target-heading { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    .target-index { margin: 0; }
    .name-input { width: 100%; border: 0; border-bottom: 1px solid var(--hairline); border-radius: 0; background: transparent; color: var(--ink); padding: 0 0 10px; font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 34px; font-weight: 600; line-height: 1.15; letter-spacing: -.37px; }
    .name-input:focus-visible { border-bottom-color: var(--blue); outline: 0; }
    .btn-icon { display: inline-grid; width: 36px; height: 36px; place-items: center; flex: 0 0 auto; border: 1px solid var(--hairline); border-radius: 50%; background: transparent; color: currentColor; cursor: pointer; font-size: 22px; font-weight: 300; line-height: 1; }
    .btn-icon:hover { border-color: currentColor; }
    .target-main { display: grid; gap: 32px; margin-top: 24px; }
    .route-summary { display: grid; gap: 4px; border: 1px solid var(--hairline); background: var(--paper); padding: 16px 18px; }
    .bus-info-item { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .bus-info-item span { color: var(--ink); font-weight: 600; }
    .route-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .bus-selector { border: 1px solid var(--hairline); background: var(--pearl); padding: 24px; }
    .search-input { width: 100%; min-height: 44px; border: 1px solid var(--hairline); border-radius: 9999px; background: #fff; color: var(--ink); padding: 10px 20px; }
    .search-results { margin-top: 8px; overflow: hidden; border-radius: 8px; }
    .search-results:not(:empty) { border: 1px solid var(--hairline); }
    .result-item, .result-empty { padding: 10px 14px; background: #fff; color: var(--ink); font-size: 14px; }
    .result-item { border-bottom: 1px solid var(--hairline); cursor: pointer; }
    .result-item:last-child { border-bottom: 0; }
    .result-item:hover { background: var(--paper); color: var(--blue); }
    .result-empty { color: var(--muted); }
    .settings-grid { display: grid; grid-template-columns: minmax(0, .9fr) minmax(300px, 1.1fr); gap: 48px; align-items: start; }
    .settings-block { padding-top: 4px; }
    .settings-block + .settings-block { margin-top: 32px; }
    .section-label { margin-top: 0; margin-bottom: 12px; }
    .weekday-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .weekday-btn { width: 42px; height: 42px; border: 1px solid var(--hairline); border-radius: 9999px; background: transparent; color: currentColor; cursor: pointer; font-size: 14px; font-weight: 400; }
    .weekday-btn.active { border-color: var(--blue); background: var(--blue); color: #fff; }
    .seat-preference-summary { display: flex; flex-wrap: wrap; gap: 8px; min-height: 32px; margin-bottom: 14px; }
    .seat-priority { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 9999px; background: var(--blue); color: #fff; padding: 6px 12px; font-size: 12px; cursor: pointer; }
    .seat-priority b { font-weight: 600; }
    .seat-priority-clear { opacity: .75; }
    .seat-empty { color: var(--muted); font-size: 12px; }
    .seat-map-labels { display: grid; grid-template-columns: 34px 34px 16px 34px 34px; gap: 3px; justify-content: center; margin-bottom: 6px; color: var(--muted); font-size: 10px; text-align: center; }
    .seat-map-bus { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--hairline); background: var(--paper); padding: 12px 8px; }
    .seat-map-row { display: flex; align-items: center; justify-content: center; gap: 3px; }
    .seat-aisle { width: 16px; flex: 0 0 16px; }
    .seat-btn { width: 34px; height: 30px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; border: 1px solid var(--hairline); border-radius: 5px; background: #fff; color: var(--ink); cursor: pointer; font-size: 11px; font-weight: 400; padding: 0; }
    .seat-btn:hover { border-color: var(--blue); color: var(--blue); }
    .seat-btn.selected { border-color: var(--blue); background: var(--blue); color: #fff; }
    .seat-map-legend { margin: 10px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .date-list { display: grid; gap: 8px; margin-bottom: 10px; }
    .date-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--hairline); background: var(--paper); padding: 10px 12px; font-size: 14px; }
    .date-remove { width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; color: currentColor; cursor: pointer; font-size: 20px; font-weight: 300; line-height: 1; }
    .date-add-row { display: flex; align-items: center; gap: 8px; }
    .date-add-row input[type="date"] { flex: 1; min-width: 0; }
    .add-target-bar { display: flex; justify-content: center; background: var(--paper); padding: 40px 20px; }
    .save-bar { position: sticky; bottom: 0; z-index: 9; display: flex; justify-content: center; border-top: 1px solid var(--hairline); background: rgba(245, 245, 247, .88); padding: 12px 20px; backdrop-filter: blur(18px); }
    .save-bar button { min-width: min(320px, 100%); }
    #status { width: min(980px, calc(100% - 40px)); min-height: 28px; margin: 0 auto; padding: 12px 0 20px; color: var(--muted); font-size: 14px; text-align: center; }
    #status.ok { color: var(--blue); }
    #status.err { border-left: 2px solid var(--blue); color: var(--ink); text-align: left; padding-left: 12px; }
    @media (max-width: 640px) { .content-frame, .target-content { width: min(100% - 40px, 980px); } .connection-section { padding: 48px 0; } .connection-grid, .settings-grid { grid-template-columns: 1fr; gap: 40px; } .connection-copy h2 { font-size: 34px; } .target-surface { padding: 48px 0; } .name-input { font-size: 28px; } .target-heading { align-items: flex-start; } .bus-selector { padding: 18px; } .date-add-row { align-items: stretch; flex-direction: column; } .date-add-row .btn { width: 100%; } .save-bar { padding: 12px 20px; } }
  </style>
</head>
<body>
  <header class="global-nav"><div class="nav-inner"><a class="wordmark" href="#top">MiRi</a><span>예약 설정</span></div></header>
  <main id="top">
    <section class="sub-nav"><div class="content-frame"><h1>예약 설정</h1><span>GitHub Pages</span></div></section>
    <section class="connection-section">
      <div class="content-frame connection-grid">
        <div class="connection-copy"><p class="eyebrow">MiRi Macro</p><h2>내 일정에 맞춘<br />예약 자동화</h2><p>GitHub 저장소에서 설정을 불러와 버스, 요일, 선호 좌석과 모니터링 날짜를 관리합니다.</p></div>
        <div class="connection-form">
          <label>저장소 <input type="text" id="repo" placeholder="예: username/miri-macro" /></label>
          <label>Personal Access Token <input type="password" id="pat" placeholder="github_pat_..." /></label>
          <p class="form-note">PAT는 이 탭에서만 임시 보관되며, 탭을 닫으면 삭제됩니다.</p>
          <div><button class="btn btn-primary" onclick="loadConfig()">설정 불러오기</button></div>
        </div>
      </div>
    </section>
    <section id="config-section" class="config-section">
      <div id="targets-container"></div>
      <div class="add-target-bar"><button class="btn btn-secondary" onclick="addTarget()">예약 대상 추가</button></div>
      <div class="save-bar"><button class="btn btn-primary" onclick="saveConfig()">변경 사항 저장</button></div>
    </section>
    <div id="status" role="status" aria-live="polite"></div>
  </main>

<script>
  const DAYS = [
    { code: 'MON', label: '월' }, { code: 'TUE', label: '화' },
    { code: 'WED', label: '수' }, { code: 'THU', label: '목' },
    { code: 'FRI', label: '금' }, { code: 'SAT', label: '토' },
    { code: 'SUN', label: '일' },
  ];
  let configData = null;
  let fileSha = '';
  let lineData = [];
  const turnMap = {};    // lineTurnUid -> { lineNo, lineName, departureTime, stations, line }
  const stationMap = {}; // stationUid -> stationName
  const cardState = {};  // ti -> { lineTurnUid, onStationUid, offStationUid, selectedTurnStations, offCandidates }

  function setStatus(msg, type = '') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = type;
  }

  function getGitHub() {
    const repo = document.getElementById('repo').value.trim();
    const pat = document.getElementById('pat').value.trim();
    sessionStorage.setItem('gh_repo', repo);
    sessionStorage.setItem('gh_pat', pat);
    return { repo, pat };
  }

  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('repo').value = sessionStorage.getItem('gh_repo') || 'curlyjun/miri-macro';
    document.getElementById('pat').value = sessionStorage.getItem('gh_pat') || '';
  });

  async function loadConfig() {
    const { repo, pat } = getGitHub();
    if (!repo || !pat) { setStatus('저장소와 PAT를 입력해주세요.', 'err'); return; }
    setStatus('불러오는 중...');
    try {
      const res = await fetch(`https://api.github.com/repos/${repo}/contents/config.json`, {
        headers: { Authorization: `Bearer ${pat}`, Accept: 'application/vnd.github.v3+json' },
      });
      if (!res.ok) throw new Error(`GitHub API ${res.status}: ${await res.text()}`);
      const data = await res.json();
      fileSha = data.sha;
      const bytes = Uint8Array.from(atob(data.content.replace(/\n/g, '')), c => c.charCodeAt(0));
      configData = JSON.parse(new TextDecoder().decode(bytes));

      setStatus('노선 데이터 로딩 중...');
      try {
        const lineRes = await fetch(`https://raw.githubusercontent.com/${repo}/main/line.json`);
        if (lineRes.ok) buildLineMaps((await lineRes.json()).data || []);
      } catch (e) {
        console.warn('line.json 로딩 실패:', e.message);
      }

      renderConfig();
      document.getElementById('config-section').style.display = 'block';
      setStatus('설정을 불러왔습니다.', 'ok');
    } catch (err) {
      setStatus(`오류: ${err.message}`, 'err');
    }
  }

  function buildLineMaps(data) {
    lineData = data;
    data.forEach(line => {
      line.turns.forEach(turn => {
        if (!turn.useYn) return;
        turnMap[turn.uid] = {
          lineNo: line.no,
          lineName: line.name,
          departureTime: turn.beginStation?.departureTime || '',
          stations: turn.stations || [],
          line,
        };
        (turn.stations || []).forEach(s => { if (s.uid) stationMap[s.uid] = s.name; });
      });
    });
  }

  function escHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function busInfoHtml(ti) {
    const s = cardState[ti] || {};
    const info = turnMap[s.lineTurnUid];
    const onName = s.onStationUid ? (stationMap[s.onStationUid] || '알 수 없음') : '—';
    const offName = s.offStationUid ? (stationMap[s.offStationUid] || '알 수 없음') : '—';
    const busLine = info ? `${info.lineNo}  ${info.departureTime} 출발` : (s.lineTurnUid ? '노선 정보 없음 (line.json 확인)' : '—');
    return `
      <div class="bus-info-item">노선 <span>${escHtml(busLine)}</span></div>
      <div class="bus-info-item">승차 <span>${escHtml(onName)}</span> · 하차 <span>${escHtml(offName)}</span></div>
    `;
  }

  function renderConfig() {
    const container = document.getElementById('targets-container');
    container.innerHTML = '';
    configData.targets.forEach((target, ti) => {
      cardState[ti] = {
        lineTurnUid: target.lineTurnUid || '',
        onStationUid: target.onStationUid || '',
        offStationUid: target.offStationUid || '',
      };
      appendTargetCard(ti, target);
    });
  }

  function buildSeatMap(ti, preferredSeats) {
    const wrapper = document.getElementById(`seat-map-${ti}`);
    if (!wrapper) return;

    const selected = Array.isArray(preferredSeats) ? [...preferredSeats] : [];

    function render() {
      wrapper.innerHTML = '';

      // 선택 순위 요약
      const summary = document.createElement('div');
      summary.className = 'seat-preference-summary';
      if (selected.length === 0) {
        summary.innerHTML = '<span class="seat-empty">좌석을 클릭해 우선순위를 지정하세요</span>';
      } else {
        selected.forEach((seatNo, idx) => {
          const badge = document.createElement('button');
          badge.type = 'button';
          badge.className = 'seat-priority';
          badge.innerHTML = `${idx + 1}순위 <b>${seatNo}번</b> <span class="seat-priority-clear">×</span>`;
          badge.title = '클릭하면 해제';
          badge.setAttribute('aria-label', `${idx + 1}순위 ${seatNo}번 좌석 선택 해제`);
          badge.onclick = () => { selected.splice(idx, 1); render(); };
          summary.appendChild(badge);
        });
      }
      wrapper.appendChild(summary);

      const colLabels = document.createElement('div');
      colLabels.className = 'seat-map-labels';
      colLabels.innerHTML = `
        <div>운전석</div><div></div><div></div><div></div><div>출입문</div>
      `;
      wrapper.appendChild(colLabels);

      const bus = document.createElement('div');
      bus.className = 'seat-map-bus';

      for (let rowNo = 1; rowNo <= 11; rowNo++) {
        const row = document.createElement('div');
        row.className = 'seat-map-row';

        [1, 2, null, 3, 4].forEach(colNo => {
          if (colNo === null) {
            const aisle = document.createElement('div');
            aisle.className = 'seat-aisle';
            row.appendChild(aisle);
            return;
          }

          const seatNo = (rowNo - 1) * 4 + colNo;
          const btn = document.createElement('button');
          btn.className = 'seat-btn';
          btn.type = 'button';

          const priority = selected.indexOf(seatNo);
          if (priority !== -1) {
            btn.classList.add('selected');
            btn.textContent = priority + 1;
          } else {
            btn.textContent = seatNo;
          }

          btn.onclick = () => {
            const idx = selected.indexOf(seatNo);
            if (idx !== -1) {
              selected.splice(idx, 1);
            } else if (selected.length < 5) {
              selected.push(seatNo);
            }
            render();
          };

          row.appendChild(btn);
        });

        bus.appendChild(row);
      }

      wrapper.appendChild(bus);

      const legend = document.createElement('div');
      legend.className = 'seat-map-legend';
      legend.textContent = `좌석 클릭 → 순위 추가 (최대 5석) · 뱃지 클릭 → 해제 · 현재 ${selected.length}/5석 선택됨`;
      wrapper.appendChild(legend);
    }

    render();
    wrapper._getPreferredSeats = () => [...selected];
  }

  function appendTargetCard(ti, target) {
    const container = document.getElementById('targets-container');
    const card = document.createElement('article');
    card.className = 'target-surface';
    card.id = `target-card-${ti}`;
    card.innerHTML = `
      <div class="target-content">
      <div class="target-heading">
        <span class="target-index">예약 대상 ${ti + 1}</span>
        <button class="btn-icon" onclick="removeTarget(${ti})" aria-label="예약 대상 삭제" title="예약 대상 삭제">×</button>
      </div>
      <input type="text" class="name-input" id="name-input-${ti}"
        value="${escHtml(target.name)}" placeholder="예약 이름" />
      <div class="target-main">
      <div class="route-editor">
        <p class="section-label">노선</p>
        <div class="route-summary" id="bus-info-${ti}">${busInfoHtml(ti)}</div>
        <div class="route-actions"><button class="btn btn-secondary btn-small" onclick="toggleBusSelector(${ti})">노선 변경</button></div>

        <div class="bus-selector" id="bus-selector-${ti}" style="display:none">
          <p class="section-label">노선 검색</p>
          <input type="text" class="search-input" id="line-search-${ti}"
            placeholder="노선 번호 또는 이름"
            oninput="onLineSearch(${ti})" autocomplete="off" />
          <div class="search-results" id="line-results-${ti}"></div>

          <div id="turn-section-${ti}" style="display:none">
            <p class="section-label">출발 시간</p>
            <select class="select-input" id="turn-select-${ti}" onchange="onTurnChange(${ti})">
              <option value="">출발 시간 선택</option>
            </select>
          </div>

          <div id="on-station-section-${ti}" style="display:none">
            <p class="section-label">승차 정류장</p>
            <input type="text" class="search-input" id="on-search-${ti}"
              placeholder="정류장 이름 검색"
              oninput="onOnSearch(${ti})" onfocus="onOnSearch(${ti})" autocomplete="off" />
            <div class="search-results" id="on-results-${ti}"></div>
          </div>

          <div id="off-station-section-${ti}" style="display:none">
            <p class="section-label">하차 정류장</p>
            <input type="text" class="search-input" id="off-search-${ti}"
              placeholder="정류장 이름 검색"
              oninput="onOffSearch(${ti})" onfocus="onOffSearch(${ti})" autocomplete="off" />
            <div class="search-results" id="off-results-${ti}"></div>
          </div>
        </div>
      </div>
      <div class="settings-grid">
        <div>
          <div class="settings-block"><p class="section-label">자동 예약 요일</p><div class="weekday-grid" id="weekdays-${ti}"></div></div>
          <div class="settings-block"><p class="section-label">모니터링 날짜</p><div class="date-list" id="dates-${ti}"></div><div class="date-add-row"><input type="date" id="dateInput-${ti}" /><button class="btn btn-secondary btn-small" onclick="addDate(${ti})">날짜 추가</button></div></div>
        </div>
        <div class="settings-block"><p class="section-label">선호 좌석</p><div class="seat-map-wrapper" id="seat-map-${ti}"></div></div>
      </div>
      </div>
      </div>
    `;
    container.appendChild(card);

    const wdGrid = document.getElementById(`weekdays-${ti}`);
    DAYS.forEach(({ code, label }) => {
      const btn = document.createElement('button');
      btn.className = 'weekday-btn' + (target.weekdays?.includes(code) ? ' active' : '');
      btn.textContent = label;
      btn.dataset.code = code;
      btn.onclick = () => btn.classList.toggle('active');
      wdGrid.appendChild(btn);
    });

    buildSeatMap(ti, target.seatPreference?.preferredSeats || []);

    renderDates(ti, target.monitorDates || []);
  }

  function toggleBusSelector(ti) {
    const sel = document.getElementById(`bus-selector-${ti}`);
    const open = sel.style.display === 'none';
    sel.style.display = open ? 'block' : 'none';
    if (open) {
      document.getElementById(`line-search-${ti}`).value = '';
      document.getElementById(`line-results-${ti}`).innerHTML = '';
      document.getElementById(`turn-section-${ti}`).style.display = 'none';
      document.getElementById(`on-station-section-${ti}`).style.display = 'none';
      document.getElementById(`off-station-section-${ti}`).style.display = 'none';
      document.getElementById(`line-search-${ti}`).focus();
    }
  }

  function onLineSearch(ti) {
    const q = document.getElementById(`line-search-${ti}`).value.trim().toLowerCase();
    const results = document.getElementById(`line-results-${ti}`);
    if (!q) { results.innerHTML = ''; return; }

    const matches = lineData
      .filter(l => l.no.toLowerCase().includes(q) || l.name.toLowerCase().includes(q))
      .slice(0, 8);

    results.innerHTML = '';
    if (!matches.length) {
      results.innerHTML = '<div class="result-empty">검색 결과 없음</div>';
      return;
    }
    matches.forEach(line => {
      const item = document.createElement('div');
      item.className = 'result-item';
      item.textContent = `${line.no}  ${line.name}`;
      item.onclick = () => selectLine(ti, line);
      results.appendChild(item);
    });
  }

  function selectLine(ti, line) {
    document.getElementById(`line-search-${ti}`).value = `${line.no}  ${line.name}`;
    document.getElementById(`line-results-${ti}`).innerHTML = '';
    cardState[ti].lineTurnUid = null;
    cardState[ti].onStationUid = null;
    cardState[ti].offStationUid = null;

    const bookableTurnUids = new Set(line.fares.map(f => f.lineTurnUid));
    const turns = line.turns.filter(t => t.useYn && t.bookYn && bookableTurnUids.has(t.uid));

    const turnSel = document.getElementById(`turn-select-${ti}`);
    turnSel.innerHTML = '<option value="">출발 시간 선택</option>';
    turns.forEach(turn => {
      const opt = document.createElement('option');
      opt.value = turn.uid;
      opt.textContent = `${turn.beginStation?.departureTime || ''} 출발`;
      turnSel.appendChild(opt);
    });

    document.getElementById(`turn-section-${ti}`).style.display = 'block';
    document.getElementById(`on-station-section-${ti}`).style.display = 'none';
    document.getElementById(`off-station-section-${ti}`).style.display = 'none';
  }

  function onTurnChange(ti) {
    const turnUid = document.getElementById(`turn-select-${ti}`).value;
    if (!turnUid) return;
    cardState[ti].lineTurnUid = turnUid;
    cardState[ti].onStationUid = null;
    cardState[ti].offStationUid = null;
    cardState[ti].selectedTurnStations = turnMap[turnUid]?.stations || [];

    document.getElementById(`on-station-section-${ti}`).style.display = 'block';
    document.getElementById(`on-search-${ti}`).value = '';
    document.getElementById(`on-results-${ti}`).innerHTML = '';
    document.getElementById(`off-station-section-${ti}`).style.display = 'none';
  }

  function onOnSearch(ti) {
    const q = document.getElementById(`on-search-${ti}`).value.trim().toLowerCase();
    const results = document.getElementById(`on-results-${ti}`);
    const stations = (cardState[ti].selectedTurnStations || []).filter(s => s.onYn);
    const matches = (q ? stations.filter(s => s.name.toLowerCase().includes(q)) : stations).slice(0, 8);

    results.innerHTML = '';
    if (!matches.length) {
      results.innerHTML = `<div class="result-empty">${q ? '검색 결과 없음' : '정류장 없음'}</div>`;
      return;
    }
    matches.forEach(s => {
      const item = document.createElement('div');
      item.className = 'result-item';
      item.textContent = s.name;
      item.onclick = () => selectOnStation(ti, s);
      results.appendChild(item);
    });
  }

  function selectOnStation(ti, station) {
    document.getElementById(`on-search-${ti}`).value = station.name;
    document.getElementById(`on-results-${ti}`).innerHTML = '';
    cardState[ti].onStationUid = station.uid;
    cardState[ti].offStationUid = null;

    const allStations = cardState[ti].selectedTurnStations || [];
    const onIdx = allStations.findIndex(s => s.uid === station.uid);
    cardState[ti].offCandidates = allStations.slice(onIdx + 1).filter(s => s.offYn);

    document.getElementById(`off-station-section-${ti}`).style.display = 'block';
    document.getElementById(`off-search-${ti}`).value = '';
    document.getElementById(`off-results-${ti}`).innerHTML = '';
  }

  function onOffSearch(ti) {
    const q = document.getElementById(`off-search-${ti}`).value.trim().toLowerCase();
    const results = document.getElementById(`off-results-${ti}`);
    const candidates = cardState[ti].offCandidates || [];
    const matches = (q ? candidates.filter(s => s.name.toLowerCase().includes(q)) : candidates).slice(0, 8);

    results.innerHTML = '';
    if (!matches.length) {
      results.innerHTML = `<div class="result-empty">${q ? '검색 결과 없음' : '하차 정류장 없음'}</div>`;
      return;
    }
    matches.forEach(s => {
      const item = document.createElement('div');
      item.className = 'result-item';
      item.textContent = s.name;
      item.onclick = () => selectOffStation(ti, s);
      results.appendChild(item);
    });
  }

  function selectOffStation(ti, station) {
    document.getElementById(`off-search-${ti}`).value = station.name;
    document.getElementById(`off-results-${ti}`).innerHTML = '';
    cardState[ti].offStationUid = station.uid;

    const info = turnMap[cardState[ti].lineTurnUid];
    if (info) {
      const nameInput = document.getElementById(`name-input-${ti}`);
      if (!nameInput.value.trim()) {
        nameInput.value = `[${info.lineNo}] ${info.departureTime} 버스`;
      }
    }

    document.getElementById(`bus-info-${ti}`).innerHTML = busInfoHtml(ti);
    document.getElementById(`bus-selector-${ti}`).style.display = 'none';
  }

  function addTarget() {
    const ti = configData.targets.length;
    const newTarget = {
      name: '', lineTurnUid: '', onStationUid: '', offStationUid: '',
      weekdays: [], monitorDates: [],
      seatPreference: { preferredSeats: [] },
    };
    configData.targets.push(newTarget);
    cardState[ti] = { lineTurnUid: '', onStationUid: '', offStationUid: '' };
    appendTargetCard(ti, newTarget);
    document.getElementById(`bus-selector-${ti}`).style.display = 'block';
    document.getElementById(`line-search-${ti}`).focus();
    document.getElementById(`target-card-${ti}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function removeTarget(ti) {
    document.getElementById(`target-card-${ti}`)?.remove();
    configData.targets[ti] = null;
  }

  function renderDates(ti, dates) {
    const list = document.getElementById(`dates-${ti}`);
    list.innerHTML = '';
    dates.forEach((d, di) => {
      const item = document.createElement('div');
      item.className = 'date-item';
      item.innerHTML = `<span>${d}</span><button class="date-remove" onclick="removeDate(${ti}, ${di})" aria-label="${d} 삭제">×</button>`;
      list.appendChild(item);
    });
  }

  function addDate(ti) {
    const input = document.getElementById(`dateInput-${ti}`);
    const val = input.value;
    if (!val || !configData.targets[ti]) return;
    const target = configData.targets[ti];
    if (!target.monitorDates) target.monitorDates = [];
    if (!target.monitorDates.includes(val)) { target.monitorDates.push(val); target.monitorDates.sort(); }
    input.value = '';
    renderDates(ti, target.monitorDates);
  }

  function removeDate(ti, di) {
    const target = configData.targets[ti];
    if (!target) return;
    target.monitorDates.splice(di, 1);
    renderDates(ti, target.monitorDates);
  }

  function collectConfig() {
    const cards = Array.from(
      document.getElementById('targets-container').querySelectorAll('.target-surface[id^="target-card-"]')
    ).sort((a, b) =>
      parseInt(a.id.replace('target-card-', '')) - parseInt(b.id.replace('target-card-', ''))
    );

    configData.targets = cards.map(card => {
      const ti = parseInt(card.id.replace('target-card-', ''));
      const s = cardState[ti] || {};
      return {
        name: document.getElementById(`name-input-${ti}`)?.value || '',
        lineTurnUid: s.lineTurnUid || '',
        onStationUid: s.onStationUid || '',
        offStationUid: s.offStationUid || '',
        weekdays: Array.from(card.querySelectorAll('.weekday-btn.active')).map(b => b.dataset.code),
        monitorDates: configData.targets[ti]?.monitorDates || [],
        seatPreference: {
          preferredSeats: document.getElementById(`seat-map-${ti}`)._getPreferredSeats?.() || [],
        },
      };
    });
    return configData;
  }

  async function saveConfig() {
    const { repo, pat } = getGitHub();
    if (!repo || !pat) { setStatus('저장소와 PAT를 입력해주세요.', 'err'); return; }
    collectConfig();
    const jsonStr = JSON.stringify(configData, null, 2) + '\n';
    const content = btoa(new TextEncoder().encode(jsonStr).reduce((acc, byte) => acc + String.fromCharCode(byte), ''));
    setStatus('저장 중...');
    try {
      const res = await fetch(`https://api.github.com/repos/${repo}/contents/config.json`, {
        method: 'PUT',
        headers: {
          Authorization: `Bearer ${pat}`,
          Accept: 'application/vnd.github.v3+json',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ message: 'config: update via GitHub Pages UI', content, sha: fileSha }),
      });
      if (!res.ok) throw new Error(`GitHub API ${res.status}: ${await res.text()}`);
      const data = await res.json();
      fileSha = data.content.sha;
      setStatus('저장 완료! 서버에서 git pull 하면 반영됩니다.', 'ok');
    } catch (err) {
      setStatus(`저장 오류: ${err.message}`, 'err');
    }
  }
</script>
</body>
</html>
